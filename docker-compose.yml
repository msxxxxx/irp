services:
  demo:
    container_name: "demo_demo"
#    ports:
#      - "80:80"
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m demo
    restart: always
    volumes:
      - "./src:/opt/src:ro"
      - "./demo:/opt/demo:ro"
      - "./pages:/opt/pages:ro"
      - "./templates:/opt/templates:ro"
    environment:
      SESSION_STORAGE_URL: redis://demo:6379/0
    env_file:
      - ".env"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully   # ← ключевое
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80 >/dev/null 2>&1 || exit 1"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 10
    #   start_period: 15s
    # depends_on:
    #   - db
    #   - redis

  migrations:
    container_name: "demo_migrations"
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m migrations
    volumes:
      - ".:/opt:rw"
    env_file:
      - ".env"
    depends_on:
      db:
        condition: service_healthy   # ← ключевое
    # depends_on:
    #   - db

  db:
    container_name: "demo_db"
    image: postgres:16-alpine3.19
    hostname: "demo"
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    container_name: "demo_redis"
    hostname: "demo"
    restart: always
    image: redis:7.2.2-alpine3.18
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    container_name: "demo-nginx"
    image: nginx:1.25.3-alpine3.18
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./certs:/etc/nginx/certs:ro"
      - "./log:/var/log/nginx:rw"
      - "./static:/opt/static:ro"
      - "./templates:/opt/templates:ro"
    # depends_on:
    #   demo:
    #     condition: service_healthy
    depends_on:
      - demo
